<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background circle (Deep Space) -->
  <circle cx="80" cy="80" r="76" fill="#1A237E" stroke="#3949AB" stroke-width="6"/>
  <!-- Little stars in background -->
  <circle cx="30" cy="40" r="2" fill="#FFD54F"/>
  <circle cx="130" cy="35" r="2.5" fill="#FFD54F"/>
  <circle cx="25" cy="110" r="1.5" fill="#FFD54F"/>
  <circle cx="135" cy="115" r="2" fill="#FFD54F"/>
  <!-- Helmet Suit -->
  <rect x="52" y="125" width="56" height="30" rx="10" fill="#ECEFF1"/>
  <circle cx="80" cy="78" r="48" fill="#ECEFF1"/>
  <!-- Helmet Visor Rim -->
  <rect x="42" y="48" width="76" height="58" rx="28" fill="#37474F"/>
  <!-- Helmet Visor Glass -->
  <rect x="46" y="52" width="68" height="50" rx="24" fill="#00BCD4"/>
  <!-- Visor reflection/gradient -->
  <path d="M52,62 Q80,50 108,62 Q95,78 52,62 Z" fill="#E0F7FA" opacity="0.6"/>
  <!-- Astronaut Kid Face inside visor -->
  <ellipse cx="80" cy="80" rx="26" ry="22" fill="#FFE0B2"/>
  <circle cx="70" cy="78" r="4" fill="#37474F"/>
  <circle cx="90" cy="78" r="4" fill="#37474F"/>
  <circle cx="71" cy="76" r="1.5" fill="#FFF"/>
  <circle cx="91" cy="76" r="1.5" fill="#FFF"/>
  <path d="M74,88 Q80,94 86,88" stroke="#D84315" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="64" cy="84" r="3" fill="#FF8A80" opacity="0.6"/>
  <circle cx="96" cy="84" r="3" fill="#FF8A80" opacity="0.6"/>
  <!-- Helmet details (Antenna) -->
  <line x1="80" y1="30" x2="80" y2="18" stroke="#ECEFF1" stroke-width="4"/>
  <circle cx="80" cy="16" r="6" fill="#FF5252"/>
  <!-- Ear covers -->
  <rect x="28" y="70" width="8" height="20" rx="4" fill="#B0BEC5"/>
  <rect x="124" y="70" width="8" height="20" rx="4" fill="#B0BEC5"/>
</svg>
