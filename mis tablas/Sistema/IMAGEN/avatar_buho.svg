<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="#3F51B5" stroke="#7986CB" stroke-width="6"/>
  <!-- Body -->
  <ellipse cx="80" cy="95" r="48" rx="46" ry="52" fill="#5C6BC0"/>
  <!-- Belly -->
  <ellipse cx="80" cy="105" rx="30" ry="34" fill="#E8EAF6"/>
  <!-- Chest feathers markings -->
  <path d="M70,95 Q80,105 90,95 M65,108 Q80,118 95,108 M72,120 Q80,128 88,120" stroke="#9FA8DA" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wings -->
  <ellipse cx="36" cy="100" rx="14" ry="28" fill="#3949AB" transform="rotate(15 36 100)"/>
  <ellipse cx="124" cy="100" rx="14" ry="28" fill="#3949AB" transform="rotate(-15 124 100)"/>
  <!-- Ear Tufts -->
  <polygon points="45,55 35,28 60,42" fill="#3949AB"/>
  <polygon points="115,55 125,28 100,42" fill="#3949AB"/>
  <!-- Eyes -->
  <circle cx="60" cy="68" r="22" fill="#FFF"/>
  <circle cx="100" cy="68" r="22" fill="#FFF"/>
  <!-- Pupils -->
  <circle cx="62" cy="68" r="11" fill="#1A237E"/>
  <circle cx="98" cy="68" r="11" fill="#1A237E"/>
  <!-- Highlights -->
  <circle cx="65" cy="64" r="4" fill="#FFF"/>
  <circle cx="101" cy="64" r="4" fill="#FFF"/>
  <!-- Glasses / Anteojos de Sabio -->
  <circle cx="60" cy="68" r="23" fill="none" stroke="#FFC107" stroke-width="4"/>
  <circle cx="100" cy="68" r="23" fill="none" stroke="#FFC107" stroke-width="4"/>
  <line x1="83" y1="68" x2="77" y2="68" stroke="#FFC107" stroke-width="4"/>
  <!-- Beak -->
  <polygon points="80,75 73,88 87,88" fill="#FF9800"/>
  <!-- Graduation Cap / Birrete Sabio -->
  <polygon points="80,18 125,32 80,44 35,32" fill="#212121"/>
  <rect x="68" y="38" width="24" height="10" rx="2" fill="#37474F"/>
  <path d="M120,33 L126,55" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="126" cy="56" r="4" fill="#FFC107"/>
</svg>
