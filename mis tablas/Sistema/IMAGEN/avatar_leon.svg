<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="#FFA000" stroke="#FFD54F" stroke-width="6"/>
