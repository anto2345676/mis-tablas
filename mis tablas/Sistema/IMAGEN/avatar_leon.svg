  <circle cx="46" cy="50" r="14" fill="#E65100"/>
  <circle cx="114" cy="50" r="14" fill="#E65100"/>
  <circle cx="34" cy="82" r="14" fill="#E65100"/>
  <circle cx="126" cy="82" r="14" fill="#E65100"/>
  <circle cx="48" cy="114" r="14" fill="#E65100"/>
  <circle cx="112" cy="114" r="14" fill="#E65100"/>
  <!-- Ears -->
  <circle cx="50" cy="48" r="10" fill="#FFB74D"/>
