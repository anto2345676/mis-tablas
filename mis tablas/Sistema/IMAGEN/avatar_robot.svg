<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="80" cy="80" r="76" fill="#009688" stroke="#80CBC4" stroke-width="6"/>
  <!-- Robot Antenna -->
  <line x1="80" y1="36" x2="80" y2="18" stroke="#CFD8DC" stroke-width="5"/>
  <circle cx="80" cy="16" r="7" fill="#FFEB3B"/>
  <!-- Ears / Bolts -->
  <rect x="25" y="70" width="10" height="20" rx="3" fill="#90A4AE"/>
  <rect x="125" y="70" width="10" height="20" rx="3" fill="#90A4AE"/>
  <!-- Head -->
  <rect x="34" y="36" width="92" height="78" rx="18" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/>
  <!-- Screen face -->
  <rect x="44" y="46" width="72" height="56" rx="12" fill="#263238"/>
  <!-- Glowing Matrix Eyes -->
  <rect x="52" y="58" width="18" height="14" rx="4" fill="#00E676"/>
  <rect x="90" y="58" width="18" height="14" rx="4" fill="#00E676"/>
  <!-- Eye pupil dots -->
  <circle cx="61" cy="65" r="3" fill="#1B5E20"/>
  <circle cx="99" cy="65" r="3" fill="#1B5E20"/>
  <!-- Digital Smile -->
  <path d="M58,84 H102" stroke="#00E676" stroke-width="4" stroke-linecap="round"/>
  <!-- Neck & Shoulders -->
  <rect x="66" y="114" width="28" height="12" fill="#78909C"/>
  <rect x="42" y="126" width="76" height="26" rx="8" fill="#ECEFF1"/>
  <!-- Multiplication spark on chest -->
  <text x="80" y="144" font-family="'Nunito', sans-serif" font-size="18" font-weight="900" fill="#E91E63" text-anchor="middle">×</text>
</svg>
